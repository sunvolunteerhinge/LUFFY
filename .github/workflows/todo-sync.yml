name: Sync TODO README
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Commit generated README changes to dev
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Fetch main and dev refs
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main +refs/heads/dev:refs/remotes/origin/dev
          git rev-parse origin/main origin/dev
          git -c core.quotepath=false diff --name-status -M origin/main origin/dev
      - name: Generate updated README
        run: |
          python3 - <<'PY'
          import difflib, os, re, subprocess, sys
          from collections import OrderedDict
          from pathlib import Path
          workspace = Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          out_path = Path("/tmp/README.updated.md")
          README_PATH = workspace / "README.md"
          TITLE = "### 📝 Complete TODO List"
          ENTRY_RE = re.compile(r'^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<message>.*?)$')
          def git(*args, check=True):
              p = subprocess.run(["git", *args], cwd=workspace, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and p.returncode != 0:
                  print(p.stdout); print(p.stderr, file=sys.stderr)
                  raise SystemExit("git failed: " + " ".join(args))
              return p
          def git_show(spec):
              p = subprocess.run(["git", "show", spec], cwd=workspace, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              return None if p.returncode != 0 else p.stdout.decode("utf-8", errors="replace")
          def extract_todos(path, rev):
              text = git_show(rev + ":" + path)
              if text is None: return []
              out = []
              for n, line in enumerate(text.splitlines(), 1):
                  pos = line.find("TODO")
                  if pos < 0: continue
                  msg = line[pos + 4:].strip()
                  if msg.startswith(":"): msg = msg[1:].lstrip()
                  out.append(f"- [ ] **{path}:{n}** - {msg}")
              return out
          raw = README_PATH.read_bytes()
          nl = "\r\n" if b"\r\n" in raw else "\n"
          readme = raw.decode("utf-8")
          lines = readme.splitlines(keepends=True)
          ti = next((i for i,x in enumerate(lines) if x.rstrip("\r\n") == TITLE), None)
          if ti is None: raise SystemExit("title missing")
          ei = next((i for i in range(ti+1, len(lines)) if lines[i].startswith("## ")), None)
          if ei is None: raise SystemExit("section end missing")
          groups = OrderedDict(); seq = []
          for row in "".join(lines[ti+1:ei]).splitlines():
              if not row.strip(): continue
              m = ENTRY_RE.match(row)
              if not m: raise SystemExit("bad entry: " + repr(row))
              seq.append(m.group("path")); groups.setdefault(m.group("path"), []).append(row)
          if seq != sorted(seq): raise SystemExit("baseline paths not sorted")
          for path, block in groups.items():
              nums = [int(ENTRY_RE.match(x).group("line")) for x in block]
              if nums != sorted(nums): raise SystemExit("baseline lines not sorted: " + path)
          affected = set()
          for row in git("-c", "core.quotepath=false", "diff", "--name-status", "-M", "origin/main", "origin/dev").stdout.splitlines():
              parts = row.split("\t")
              if len(parts) < 2: continue
              cand = parts[1:3] if parts[0].startswith(("R", "C")) else [parts[-1]]
              affected.update(x for x in cand if x.endswith(".py"))
          dev_py = [x for x in git("ls-tree", "-r", "--name-only", "origin/dev").stdout.splitlines() if x.endswith(".py")]
          print("dev py files:", len(dev_py)); print("affected:", sorted(affected)); print("baseline entries:", len(seq))
          bad = []
          for path in sorted(affected):
              old_main = extract_todos(path, "origin/main")
              if old_main and old_main != groups.get(path, []):
                  bad.append(path)
                  print("MISMATCH", path, "\nMAIN:", "\n".join(old_main), "\nREADME:", "\n".join(groups.get(path, [])))
          if bad: raise SystemExit("extractor mismatch: " + ", ".join(bad))
          updated = OrderedDict((p, list(b)) for p,b in groups.items())
          for path in sorted(affected):
              new = extract_todos(path, "origin/dev")
              print(f"{path}: {len(updated.get(path, []))} -> {len(new)}")
              if new: updated[path] = new
              else: updated.pop(path, None)
          ordered = OrderedDict((p, updated[p]) for p in sorted(updated))
          entries = []
          for path, block in ordered.items():
              nums = [int(ENTRY_RE.match(x).group("line")) for x in block]
              if nums != sorted(nums): raise SystemExit("generated lines not sorted: " + path)
              entries.extend(block)
          new_readme = "".join(lines[:ti+1]) + nl + nl.join(entries) + nl + nl + "".join(lines[ei:])
          diff = list(difflib.unified_diff(readme.splitlines(), new_readme.splitlines(), fromfile="a/README.md", tofile="b/README.md", n=3, lineterm=""))
          print("\n".join(diff))
          for d in diff:
              if d.startswith(("---", "+++", "@@")) or not d or d[0] not in "+-": continue
              body = d[1:]
              if not body.strip(): continue
              m = ENTRY_RE.match(body)
              if m is None: raise SystemExit("non-entry line changed: " + d)
              if m.group("path") not in affected: raise SystemExit("unrelated path changed: " + body)
          print("count:", len(seq), "->", len(entries))
          if TITLE not in new_readme: raise SystemExit("title lost")
          with open(out_path, "w", encoding="utf-8", newline="") as f: f.write(new_readme)
          print("wrote", out_path)
          PY
      - name: Show dry run diff or apply and push
        env:
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          set -euo pipefail
          echo "APPLY=${APPLY:-<unset>}"
          if [ "${APPLY:-false}" = "true" ]; then
            cp /tmp/README.updated.md README.md
            if git diff --quiet -- README.md; then echo "No README changes"; else
              git add README.md
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "docs: update complete TODO list"
              git push origin HEAD:dev
            fi
          else
            echo "Dry run only."
            diff -u README.md /tmp/README.updated.md || true
          fi
